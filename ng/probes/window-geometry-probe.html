<!doctype html>
<meta charset="utf-8">
<title>cultists NG Phase 1 probe</title>
<script type="module">
  const results = [];
  const check = (condition, message) => { results.push(`${condition ? "PASS" : "FAIL"}: ${message}`); if (!condition) console.error(message); };
  window.addEventListener("load", () => {
    const app = window.cultistsNG;
    check(Boolean(app?.windowManager), "window manager is exposed after boot");
    const first = [...app.windowManager.instances.values()][0];
    const second = app.windowManager.open("off-duty-demo");
    check(first.windowInstanceId !== second.windowInstanceId, "each open creates a unique instance");
    app.windowManager.focus(second.windowInstanceId);
    check(Number(second.el.style.zIndex) > Number(first.el.style.zIndex), "focus raises z-index");
    second.setGeometry({ x: 0, y: 0, width: 320, height: 200 });
    second.persistGeometry();
    check(app.windowManager.getSavedGeometry("off-duty-demo").x === 0, "zero x coordinate is preserved");
    app.windowManager.close(second.windowInstanceId);
    check(!app.windowManager.instances.has(second.windowInstanceId), "close destroys the window instance");
    document.body.innerHTML = `<pre>${results.join("\\n")}</pre>`;
  });
</script>
