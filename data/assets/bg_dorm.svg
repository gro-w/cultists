<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <!-- Dorm room background - hand-authored flat illustration (self-made, no external asset). -->
  <defs>
    <linearGradient id="dormWallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3454" />
      <stop offset="1" stop-color="#2c2842" />
    </linearGradient>
    <linearGradient id="dormFloorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a36" />
      <stop offset="1" stop-color="#553a2a" />
    </linearGradient>
  </defs>

  <!-- wall (night colours) -->
  <rect x="0" y="0" width="480" height="190" fill="url(#dormWallGrad)" />
  <!-- floor -->
  <rect x="0" y="190" width="480" height="110" fill="url(#dormFloorGrad)" />
  <!-- floor planks -->
  <g stroke="#452f21" stroke-width="1" opacity="0.6">
    <line x1="0" y1="215" x2="480" y2="215" />
    <line x1="0" y1="245" x2="480" y2="245" />
    <line x1="0" y1="275" x2="480" y2="275" />
    <line x1="80" y1="190" x2="80" y2="300" />
    <line x1="200" y1="190" x2="200" y2="300" />
    <line x1="320" y1="190" x2="320" y2="300" />
    <line x1="440" y1="190" x2="440" y2="300" />
  </g>

  <!-- night window with moon -->
  <rect x="336" y="24" width="110" height="90" rx="4" fill="#171335" stroke="#5a5480" stroke-width="4" />
  <circle cx="405" cy="55" r="14" fill="#f4ecc9" />
  <circle cx="360" cy="80" r="1.6" fill="#f4ecc9" opacity="0.9" />
  <circle cx="380" cy="40" r="1.2" fill="#f4ecc9" opacity="0.8" />
  <circle cx="420" cy="90" r="1.4" fill="#f4ecc9" opacity="0.85" />
  <rect x="328" y="16" width="126" height="106" fill="none" stroke="#4a4468" stroke-width="6" rx="6" />

  <!-- bunk bed -->
  <g>
    <rect x="30" y="150" width="150" height="12" rx="3" fill="#8a6a4c" />
    <rect x="30" y="162" width="150" height="46" rx="4" fill="#e8e2f0" stroke="#cfc4dd" stroke-width="2" />
    <rect x="30" y="162" width="30" height="46" rx="4" fill="#d7cbe6" stroke="#cfc4dd" stroke-width="2" />
    <rect x="66" y="168" width="96" height="30" rx="4" fill="#b9a8d6" opacity="0.7" />
    <rect x="30" y="205" width="10" height="30" fill="#6c4f38" />
    <rect x="172" y="205" width="10" height="30" fill="#6c4f38" />
  </g>

  <!-- desk with laptop -->
  <g>
    <rect x="210" y="170" width="100" height="8" fill="#7a5a3f" />
    <rect x="216" y="178" width="6" height="40" fill="#5c4128" />
    <rect x="298" y="178" width="6" height="40" fill="#5c4128" />
    <rect x="228" y="150" width="46" height="26" rx="2" fill="#3a3a48" stroke="#22222c" stroke-width="2" />
    <rect x="228" y="176" width="46" height="4" fill="#22222c" />
    <circle cx="251" cy="160" r="2" fill="#7fd0ff" opacity="0.8" />
  </g>
  <!-- desk chair -->
  <rect x="285" y="190" width="20" height="6" rx="2" fill="#463a5a" />
  <rect x="290" y="196" width="4" height="18" fill="#463a5a" />

  <!-- wardrobe -->
  <rect x="392" y="130" width="70" height="130" rx="3" fill="#4a4266" stroke="#2e2a45" stroke-width="3" />
  <line x1="427" y1="130" x2="427" y2="260" stroke="#2e2a45" stroke-width="2" />
  <circle cx="418" cy="196" r="2.4" fill="#d8cfe8" />
  <circle cx="436" cy="196" r="2.4" fill="#d8cfe8" />

  <!-- rug -->
  <ellipse cx="200" cy="255" rx="70" ry="16" fill="#7a4f66" opacity="0.6" />

  <!-- fairy lights along the wall -->
  <g>
    <path d="M0 30 Q120 10 240 30 T480 30" fill="none" stroke="#5a5480" stroke-width="1.5" opacity="0.7" />
    <circle cx="40" cy="27" r="2" fill="#ffe9a8" />
    <circle cx="120" cy="16" r="2" fill="#ffd6e0" />
    <circle cx="200" cy="24" r="2" fill="#a8f0ff" />
    <circle cx="280" cy="18" r="2" fill="#ffe9a8" />
  </g>
</svg>
