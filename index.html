<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>完蛋，我被邪教徒包围了！ | Cultists</title>
  <link rel="stylesheet" href="css/win95.css" />
  <link rel="stylesheet" href="css/apps.css" />
  <link rel="stylesheet" href="css/modes.css" />
  <link rel="stylesheet" href="css/mainmenu.css" />
</head>
<body>
  <div id="work-shell" class="laptop-frame">
    <div id="desktop" class="desktop">
      <div id="desktop-icons" class="desktop-icons"></div>
      <div id="window-layer" class="window-layer"></div>
    </div>
    <button id="computer-close-button" type="button" class="win95-btn bevel-out computer-close-button hidden">关闭电脑</button>

    <div id="taskbar" class="taskbar">
    <button id="start-button" class="start-button win95-btn">
      <span class="start-icon">🪟</span> 开始
    </button>
    <div id="taskbar-tasks" class="taskbar-tasks"></div>
    <div class="taskbar-status">
      <span id="daynight-indicator" class="daynight-indicator">☀ 白天</span>
      <span id="taskbar-clock" class="taskbar-clock">08:00</span>
    </div>
    </div>

    <div id="start-menu" class="start-menu hidden"></div>
    <div id="notification-banner" class="notification-banner hidden"></div>
  </div>

  <div id="dorm-mode" class="dorm-mode-overlay hidden"></div>
  <div id="notification-banner" class="notification-banner hidden"></div>
  <div id="achievement-toast" class="achievement-toast hidden"></div>

  <div id="main-menu" class="main-menu-overlay"></div>
  <div id="ending-screen" class="ending-screen-overlay hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
